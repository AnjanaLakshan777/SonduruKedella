spring.application.name=sonduru-kedella-backend

# --- Configuration source ------------------------------------------------------
# Outside Docker, read the repository-root .env (as a properties file) so there is a
# single configuration source. Works whether the working directory is backend/ or
# the repository root. Inside Docker the file is absent and Compose supplies the
# same variables as environment variables (which take precedence anyway).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Datasource ------------------------------------------------------------------
# DB_HOST / DB_PORT are set by compose.yaml (service name "postgres", port 5432).
# Outside Docker they fall back to localhost and POSTGRES_HOST_PORT from .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:5432}}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Flyway ------------------------------------------------------------------
# Flyway owns the schema; Hibernate only validates it and never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Server / Actuator -----------------------------------------------------------
server.port=8080
management.endpoints.web.exposure.include=health,info

# --- Agreement PDFs ------------------------------------------------------------
# Private storage directory, outside any static/public folder. Relative paths resolve against
# the working directory (backend/ when run locally; compose sets an absolute path on a volume).
# In deployment this MUST be persistent storage, or uploaded agreements are lost on redeploy.
agreements.storage-dir=${AGREEMENTS_STORAGE_DIR:data/agreements}
agreements.max-size=${AGREEMENTS_MAX_SIZE:20MB}
# Spring's default is 1MB. The request limit is a little bigger than the file limit to leave room
# for the multipart boundaries; raise both together.
spring.servlet.multipart.max-file-size=${AGREEMENTS_MAX_SIZE:20MB}
spring.servlet.multipart.max-request-size=${AGREEMENTS_MAX_REQUEST_SIZE:21MB}
