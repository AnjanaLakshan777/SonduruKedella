spring.application.name=sonduru-kedella-backend

# --- Configuration source ------------------------------------------------------
# Outside Docker, read the repository-root .env (as a properties file) so there is a
# single configuration source. Works whether the working directory is backend/ or
# the repository root. Inside Docker the file is absent and Compose supplies the
# same variables as environment variables (which take precedence anyway).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Datasource ------------------------------------------------------------------
# DB_HOST / DB_PORT are set by compose.yaml (service name "postgres", port 5432).
# Outside Docker they fall back to localhost and POSTGRES_HOST_PORT from .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:5432}}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Flyway ------------------------------------------------------------------
# Flyway owns the schema; Hibernate only validates it and never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Server / Actuator -----------------------------------------------------------
server.port=8080
management.endpoints.web.exposure.include=health,info
