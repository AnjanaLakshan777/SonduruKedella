spring.application.name=sonduru-kedella-backend

# --- Configuration source ------------------------------------------------------
# Outside Docker, read the repository-root .env (as a properties file) so there is a
# single configuration source. Works whether the working directory is backend/ or
# the repository root. Inside Docker the file is absent and Compose supplies the
# same variables as environment variables (which take precedence anyway).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Datasource ------------------------------------------------------------------
# DB_HOST / DB_PORT are set by compose.yaml (service name "postgres", port 5432).
# Outside Docker they fall back to localhost and POSTGRES_HOST_PORT from .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:5432}}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Flyway ------------------------------------------------------------------
# Flyway owns the schema; Hibernate only validates it and never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Server / Actuator -----------------------------------------------------------
server.port=8080
management.endpoints.web.exposure.include=health,info

# --- Agreement PDFs ------------------------------------------------------------
# Private storage directory, outside any static/public folder. Relative paths resolve against
# the working directory (backend/ when run locally; compose sets an absolute path on a volume).
# In deployment this MUST be persistent storage, or uploaded agreements are lost on redeploy.
agreements.storage-dir=${AGREEMENTS_STORAGE_DIR:data/agreements}
agreements.max-size=${AGREEMENTS_MAX_SIZE:20MB}
# Spring's default is 1MB. The request limit is a little bigger than the file limit to leave room
# for the multipart boundaries; raise both together.
spring.servlet.multipart.max-file-size=${AGREEMENTS_MAX_SIZE:20MB}
spring.servlet.multipart.max-request-size=${AGREEMENTS_MAX_REQUEST_SIZE:21MB}

# --- Security: sessions, CORS, sign-in limits -------------------------------------
# Server-side sessions (JSESSIONID). The cookie is HttpOnly and SameSite=Lax. Secure defaults to true
# for deployment over HTTPS; compose.yaml sets SESSION_COOKIE_SECURE=false for plain-HTTP local
# development. Session ids never go into URLs.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Exact frontend origins allowed to call the API with cookies, comma separated. Empty = same origin only.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Failed sign-ins allowed per username and per client address within one window.
security.login.max-failures-per-username=${LOGIN_MAX_FAILURES_PER_USERNAME:5}
security.login.max-failures-per-address=${LOGIN_MAX_FAILURES_PER_ADDRESS:20}
security.login.window=${LOGIN_FAILURE_WINDOW:15m}
# The public health probe shows UP/DOWN only.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# --- First Super Admin (one-time bootstrap) ------------------------------------
# Used only while no SUPER_ADMIN account exists; ignored (never re-applied) afterwards. No defaults:
# set them for one start, then remove the password from the environment. See DEVELOPMENT_WORKFLOW.md.
security.bootstrap.super-admin.username=${BOOTSTRAP_SUPER_ADMIN_USERNAME:}
security.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
security.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
security.bootstrap.super-admin.display-name=${BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:}
